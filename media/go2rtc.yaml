# go2rtc — Surveillance Intelligence Lab media restream layer.
# Cameras plug in here; both the API (recording) and the perception container
# consume the SAME restream, so camera streams are opened exactly once per source.
# Sources are declared in ../config/aina.yaml under `cameras:`; the media service
# exposes each one as a restream of the same name (rtsp://media:8554/<name>,
# http://…/api/stream?src=<name> for the dashboard <video> tile).

api:
  listen: "0.0.0.0:1984"

log:
  level: info

streams:
  # Live public traffic CCTV — Virginia DOT cameras (real moving traffic, H.264
  # RTSP, published for public use). Reliable live source; see
  # https://github.com/brehldev/va_vdot_public_cameras for the full catalog.
  loading_dock:
    url: rtsp://media-sfs8.vdotcameras.com:554/rtplive/FairfaxVideo0231
    on_demand: false  # always keep the source connected — no cold-start delay when a tile opens

  warehouse_east:
    url: rtsp://media-sfs8.vdotcameras.com:554/rtplive/FairfaxVideo0640
    on_demand: false  # always keep the source connected — no cold-start delay when a tile opens

  # ── Swapping in your own camera ─────────────────────────────────────────
  # Point any stream at your own RTSP feed; go2rtc re-encodes to browser-safe
  # H.264 on demand for the dashboard <video> tile:
  #
  #   loading_dock:
  #     - rtsp://user:pass@192.168.1.50:554/stream1
  #     - "ffmpeg:rtsp://user:pass@192.168.1.50:554/stream1#video=h264"
