# GPU overlay — merge on top of docker-compose.ghcr.yml to enable the NVIDIA
# runtime for the perception container (only for hosts with a GPU + the
# NVIDIA Container Toolkit; Windows users need WSL2 GPU passthrough).
#
#   docker compose \
#     -f deploy/docker-compose.ghcr.yml \
#     -f deploy/docker-compose.ghcr.gpu.yml \
#     up -d
services:
  perception:
    runtime: nvidia
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
