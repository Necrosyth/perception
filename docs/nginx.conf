server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # Directory-index redirects (e.g. /docs/intro -> /docs/intro/) must stay on
    # the requesting origin. Left as absolute, nginx builds them from the
    # proxied Host header, which drops the port and can bounce users onto a
    # different site listening on :80.
    absolute_redirect off;

    # Docusaurus static site served with the /docs/ baseUrl baked in; the
    # dashboard proxies /docs/ here or the docs port can be hit directly.
    location / {
        try_files $uri $uri/ =404;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/png image/svg+xml;
}