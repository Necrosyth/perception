server {
    listen 3000;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # /api/* proxies to the FastAPI service (same compose network)
    location /api/ {
        proxy_pass http://api:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /media/* proxies go2rtc (MP4/MSE/HLS) via the API host; the trailing
    # slash strips the /media prefix so go2rtc sees its own /api/... paths.
    location /media/ {
        proxy_pass http://media:1984/;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }

    # /docs/* proxies the Docusaurus documentation site (docs service). The
    # prefix is preserved; the docs container serves it with baseUrl /docs/.
    location /docs/ {
        proxy_pass http://docs:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}